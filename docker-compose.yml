services:
  backend:
    build: ./backend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app        # dev: код с хоста + uvicorn --reload
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    networks: [internal]

  media:
    build: ./media-server
    command: npm run dev                      # ← вместо CMD из Dockerfile
    restart: unless-stopped                   # ← воркер умер → exit → docker поднимет
    environment:
      HTTP_PORT: 4443
      LISTEN_IP: 0.0.0.0
      BACKEND_URL: http://backend:8000
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      MEDIASOUP_RTC_MIN_PORT: 40000
      MEDIASOUP_RTC_MAX_PORT: 40100
      MAX_PEERS_PER_ROOM: ${MAX_PEERS_PER_ROOM:-50}
      ROOM_CLOSE_DELAY_MS: ${ROOM_CLOSE_DELAY_MS:-15000}
      STUN_URL: ${STUN_URL:-}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    ports:
      - "40000-40100:40000-40100/udp"
    volumes:
      - ./media-server:/app
      - /app/node_modules   # модули из образа не затираются маунтом
    networks: [internal]

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules   # тот же, что у media
    networks: [ internal ]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on: [backend, media]
    networks: [internal]

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
