name: Deploy

on:
  workflow_run:
    workflows: ["Build & Push"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка статики фронтенда
        uses: actions/setup-node@v5
        with: { node-version: "20" }
      - run: cd frontend && npm install --ignore-scripts && npm run build

      - name: Подготовка файлов для переноса
        run: |
          mkdir -p bundle
          cp docker-compose.prod.yml bundle/
          cp nginx/nginx.prod.conf bundle/
          cp coturn/turnserver.conf bundle/
          cp -r frontend/dist bundle/frontend-dist

      - name: Загрузка на VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bundle/*"
          target: "/opt/vc"
          strip_components: 1

      - name: Развертывание
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/vc

            if [ ! -f .env ]; then
              echo "ОШИБКА: /opt/vc/.env отсутствует — создайте вручную (см. README)"
              exit 1
            fi

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head

            echo "--- статус ---"
            docker compose -f docker-compose.prod.yml ps
