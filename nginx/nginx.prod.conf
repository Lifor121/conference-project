worker_processes auto;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;                 # TLS терминирует NPM и проксирует сюда по http
    server_name _;

    client_max_body_size 10m;

    location /ws {
      proxy_pass http://media:4443;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(docs|openapi.json|redoc) {
      proxy_pass http://backend:8000;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";   # SPA: index.html не кэшируем
    }

    location ~* \.(js|css|svg|woff2?)$ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";  # хэшированные ассеты — навсегда
    }
  }
}
