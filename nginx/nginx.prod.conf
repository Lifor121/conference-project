worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker embedded DNS (127.0.0.11): контейнеры апстримов пересоздаются
  # при каждом деплое и меняют IP. Без resolver nginx резолвит имена
  # единожды при старте и кэширует навсегда — после первого же деплоя,
  # не пересоздавшего nginx, получаем 502 на /ws и /api/. С переменной
  # в proxy_pass nginx переспрашивает DNS каждые valid= секунд.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /ws {
      # переменная => имя резолвится через resolver на каждом цикле, а не один раз при старте
      set $media_upstream http://media:4443;
      proxy_pass $media_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;
    }

    location /api/ {
      set $backend_upstream http://backend:8000;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(docs|openapi.json|redoc) {
      set $backend_upstream http://backend:8000;
      proxy_pass $backend_upstream;
    }

    location ~* \.(js|css|svg|woff2?)$ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
