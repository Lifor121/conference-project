worker_processes auto;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;

  # не проксировать тела >10МБ (у нас signaling маленький, запас на запись не нужен)
  client_max_body_size 10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # --- signaling (media-server) ---
    location /ws {
      proxy_pass http://media:4443;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 1h;   # idle-вебсокеты не рвать час
    }

    # --- REST API (FastAPI) ---
    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # --- FastAPI docs на время разработки ---
    location ~ ^/(docs|openapi.json|redoc) {
      proxy_pass http://backend:8000;
    }

    # --- production-сборка фронтенда ---
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;   # SPA-роутинг: /room/...
    }
  }
}
