# слушаем стандартный порт STUN/TURN
listening-port=3478
# TLS-обёртка TURN — включим позже, когда появится wildcard/real cert
# tls-listening-port=5349

# fingerprint обязателен для WebRTC-клиентов
fingerprint

# long-term credentials: одна пара на инсталляцию для dev
lt-cred-mech
user=vc:vc_dev_turn_secret_change_me

realm=vc.local

# диапазон релей-портов (публикуем в compose)
min-port=49160
max-port=49200

# уходим от RFC5780-запросов, они ломаются за NAT
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# логирование
log-file=stdout
verbose
